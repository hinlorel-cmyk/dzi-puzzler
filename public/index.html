<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高清图拼图器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #222;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 22px 16px 40px;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 8px;
    }

    .desc {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .box {
      margin-top: 18px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }

    .status {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .bar {
      height: 10px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #222;
      transition: width .2s;
    }

    .error {
      color: #b00020;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    a.download {
      display: block;
      margin-top: 14px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      background: #1677ff;
      color: white;
      text-decoration: none;
    }

    .small {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>高清图拼图器</h1>

    <div class="desc">
      输入你有权处理的公开 IIIF 图片服务地址。
      程序会尝试读取最高分辨率，并拼成完整图片。
    </div>

    <textarea id="url"
      placeholder="例如：
https://example.com/iiif/xxxxx/info.json"></textarea>

    <button id="start">开始生成高清图</button>

    <div class="box">
      <div id="status" class="status">等待开始</div>

      <div class="bar">
        <div id="progress" class="progress"></div>
      </div>

      <div id="result"></div>
    </div>

    <div class="small">
      注意：网页地址（例如 iView 页面地址）不一定就是图像服务地址。
      如果服务器无法识别，会直接显示具体原因。
    </div>

  </div>

<script>
const startBtn = document.getElementById("start");
const urlInput = document.getElementById("url");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");
const resultEl = document.getElementById("result");

startBtn.addEventListener("click", async () => {

  const url = urlInput.value.trim();

  if (!url) {
    statusEl.textContent = "请先输入地址";
    return;
  }

  startBtn.disabled = true;
  resultEl.innerHTML = "";
  progressEl.style.width = "0%";
  statusEl.textContent = "正在创建任务……";

  try {

    const response = await fetch("/api/start", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "服务器没有返回 JSON。\n\n" +
        "服务器实际返回的是：\n" +
        text.slice(0, 500)
      );
    }

    if (!response.ok) {
      throw new Error(data.error || "创建任务失败");
    }

    await monitor(data.id);

  } catch (err) {

    statusEl.textContent = "发生错误";
    resultEl.innerHTML =
      `<div class="error">${escapeHtml(err.message)}</div>`;

    startBtn.disabled = false;
  }
});

async function monitor(id) {

  while (true) {

    const response =
      await fetch("/api/status/" + encodeURIComponent(id));

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "读取任务状态时，服务器返回了 HTML 而不是 JSON。\n\n" +
        text.slice(0, 500)
      );
    }

    if (data.error && data.status === "失败") {
      throw new Error(data.error);
    }

    statusEl.textContent =
      data.status || "处理中……";

    progressEl.style.width =
      `${data.progress || 0}%`;

    if (data.ready) {

      statusEl.textContent = "完成，可以保存";

      resultEl.innerHTML =
        `<a class="download"
           href="/api/download/${encodeURIComponent(id)}">
           保存完整高清图
         </a>`;

      startBtn.disabled = false;
      return;
    }

    if (data.status === "失败") {
      throw new Error(data.error || "生成失败");
    }

    await new Promise(resolve =>
      setTimeout(resolve, 1000)
    );
  }
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
