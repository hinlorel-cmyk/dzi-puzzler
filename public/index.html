<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故宫高清图保存器</title>
<style>
body {
  margin: 0;
  padding: 24px 16px;
  font-family: -apple-system, BlinkMacSystemFont,
               "Segoe UI", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
  color: #222;
}
.box {
  max-width: 720px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}
h1 { margin-top: 0; font-size: 24px; }
textarea {
  width: 100%;
  height: 110px;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
  resize: vertical;
}
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: not-allowed; }
#status {
  margin-top: 18px;
  white-space: pre-wrap;
  line-height: 1.6;
  font-size: 14px;
}
.info {
  margin-top: 14px;
  padding: 14px;
  background: #f1f1f1;
  border-radius: 10px;
  display: none;
  white-space: pre-wrap;
  font-size: 14px;
  line-height: 1.7;
}
.download {
  display: none;
  background: #1a7f37;
}
</style>
</head>
<body>

<div class="box">
  <h1>高清全图保存器</h1>
  <p>粘贴数字文物库的 iView 地址：</p>

  <textarea id="url"
    placeholder="https://digicol.dpm.org.cn/iView?id=..."></textarea>

  <button id="analyze">自动解析最高分辨率</button>
  <div id="status"></div>
  <div id="info" class="info"></div>
  <button id="download" class="download">下载完整高清图</button>
</div>

<script>
const urlInput    = document.getElementById("url");
const analyzeBtn  = document.getElementById("analyze");
const downloadBtn = document.getElementById("download");
const statusEl    = document.getElementById("status");
const infoEl      = document.getElementById("info");

let currentToken = null;

analyzeBtn.onclick = async () => {
  const url = urlInput.value.trim();
  if (!url) {
    statusEl.textContent = "请先粘贴网址。";
    return;
  }

  analyzeBtn.disabled = true;
  downloadBtn.style.display = "none";
  infoEl.style.display = "none";
  currentToken = null;

  statusEl.textContent =
    "正在打开网页并读取高清图查看器……\n" +
    "请稍等，这一步可能需要几十秒。";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      statusEl.textContent =
        "解析失败：\n" + (data.error || `HTTP ${response.status}`);
      return;
    }

    currentToken = data.token;

    statusEl.textContent = "解析成功，可以下载了。";
    infoEl.style.display = "block";
    infoEl.textContent =
      `原图尺寸：${data.width} × ${data.height}\n` +
      `瓦片尺寸：${data.tileSize}\n` +
      `瓦片重叠：${data.overlap}\n` +
      `图片格式：${data.format}\n` +
      `最高层级：${data.maxLevel}\n` +
      `瓦片网格：${data.columns} × ${data.rows}\n` +
      `瓦片总数：${data.tiles}`;

    downloadBtn.style.display = "block";
  } catch (err) {
    statusEl.textContent = "处理失败：\n" + err.message;
  } finally {
    analyzeBtn.disabled = false;
  }
};

downloadBtn.onclick = async () => {
  if (!currentToken) return;

  downloadBtn.disabled = true;
  statusEl.textContent =
    "正在下载最高层瓦片并拼接完整大图……\n" +
    "图片越大，需要的时间越长，请耐心等待。";

  try {
    const response = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: currentToken })
    });

    if (!response.ok) {
      let msg = `HTTP ${response.status}`;
      try {
        const data = await response.json();
        msg = data.error || msg;
      } catch {}
      throw new Error(msg);
    }

    const blob = await response.blob();
    const a = document.createElement("a");
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    a.download = "故宫高清全图.jpg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 10000);

    statusEl.textContent = "完成。已开始保存图片。";
  } catch (err) {
    statusEl.textContent = "下载失败：\n" + err.message;
  } finally {
    downloadBtn.disabled = false;
  }
};
</script>

</body>
</html>
