<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>高清图处理器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    .page {
      max-width: 700px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 14px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: .5;
    }

    .panel {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
    }

    .status {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bar {
      height: 10px;
      margin-top: 12px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      width: 0;
      background: #222;
      transition: width .2s;
    }

    .error {
      margin-top: 12px;
      padding: 12px;
      background: #fff0f0;
      color: #b00020;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .download {
      display: block;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      text-align: center;
      text-decoration: none;
    }

    .tip {
      margin-top: 15px;
      color: #888;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="page">

  <h1>高清图处理器</h1>

  <div class="description">
    输入你有权处理的公开图像服务地址。
    程序会自动识别图像服务格式，并尝试取得完整高清图。
  </div>

  <textarea
    id="url"
    placeholder="输入图像服务地址，例如：
https://example.com/iiif/xxxxx/info.json"
  ></textarea>

  <button id="start">
    开始生成高清图
  </button>

  <div class="panel">

    <div id="status" class="status">
      等待开始
    </div>

    <div class="bar">
      <div id="progress" class="bar-inner"></div>
    </div>

    <div id="error"></div>

    <div id="download"></div>

  </div>

  <div class="tip">
    注意：网页查看器地址和真正的图像服务地址不是一回事。
    如果输入的是普通网页地址，程序会明确告诉你无法识别，而不会再出现
    “Unexpected token &lt;” 这种错误。
  </div>

</div>

<script>

const startButton = document.getElementById("start");
const urlInput = document.getElementById("url");
const statusBox = document.getElementById("status");
const progressBar = document.getElementById("progress");
const errorBox = document.getElementById("error");
const downloadBox = document.getElementById("download");


function setStatus(text) {
  statusBox.textContent = text;
}


function setProgress(value) {
  progressBar.style.width =
    Math.max(0, Math.min(100, value)) + "%";
}


function showError(text) {
  errorBox.textContent = text;
  errorBox.className = "error";
}


function clearResult() {
  errorBox.textContent = "";
  errorBox.className = "";
  downloadBox.innerHTML = "";
  setProgress(0);
}


async function readJson(response) {

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {

    throw new Error(
      "服务器返回的不是 JSON。\n\n" +
      "HTTP 状态：" +
      response.status +
      "\n\n" +
      "服务器返回内容：\n" +
      text.slice(0, 500)
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      "服务器请求失败"
    );
  }

  return data;
}


startButton.addEventListener("click", async () => {

  const url = urlInput.value.trim();

  clearResult();

  if (!url) {
    showError("请输入地址");
    return;
  }

  startButton.disabled = true;

  try {

    setStatus("正在创建任务……");

    const response = await fetch(
      "/api/start",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          url: url
        })
      }
    );

    const data = await readJson(response);

    if (!data.ok || !data.id) {
      throw new Error(
        data.error ||
        "任务创建失败"
      );
    }

    await watch(data.id);

  } catch (error) {

    setStatus("处理失败");

    showError(
      error.message ||
      String(error)
    );

    startButton.disabled = false;
  }
});


async function watch(id) {

  while (true) {

    await new Promise(resolve =>
      setTimeout(resolve, 800)
    );

    const response = await fetch(
      "/api/status/" +
      encodeURIComponent(id)
    );

    const data = await readJson(response);

    setStatus(
      data.status ||
      "处理中……"
    );

    setProgress(
      data.progress || 0
    );

    if (data.status === "失败") {

      throw new Error(
        data.error ||
        "服务器处理失败"
      );
    }

    if (data.ready) {

      setStatus("生成完成");

      setProgress(100);

      downloadBox.innerHTML = `
        <a
          class="download"
          href="/api/download/${encodeURIComponent(id)}"
        >
          保存完整高清图
        </a>
      `;

      startButton.disabled = false;

      return;
    }
  }
}

</script>

</body>
</html>
